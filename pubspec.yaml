name: flutter_clean_arch_template
description: 'A production-ready Flutter project template with Clean Architecture, Riverpod, and Feature-First structure.'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management - Riverpod
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # Navigation - AutoRoute
  auto_route: ^11.1.0

  # Network - Dio
  dio: ^5.9.0

  # Local Storage
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  # Using git branch to fix load-more UI overlap issue
  easy_refresh:
    git:
      url: https://github.com/xuelongqy/flutter_easy_refresh.git
      ref: v3
      path: packages/easy_refresh
  flutter_svg: ^2.0.13
  flutter_easyloading: ^3.0.5
  flutter_rating_bar: ^4.0.1
  photo_view: ^0.15.0
  image_picker: ^1.2.0
  permission_handler: ^12.0.1

  # Utilities
  dartz: ^0.10.1
  connectivity_plus: ^7.0.0
  package_info_plus: ^10.1.0
  device_info_plus: ^13.1.0
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.3.2
  flutter_keyboard_visibility: ^6.0.0

  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Logging
  talker_flutter: ^5.0.0
  talker_dio_logger: ^5.0.0
  talker_riverpod_logger: ^5.0.2
  uuid: ^4.5.1
  path_provider: ^2.1.0

  # Dependency Injection - GetIt
  get_it: ^9.2.1
  injectable: ^2.5.1

  # App Resources
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.5.4
  auto_route_generator: ^10.2.4
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  injectable_generator: ^2.8.1
  json_serializable: ^6.11.1

  # Linting
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.1
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/env/
