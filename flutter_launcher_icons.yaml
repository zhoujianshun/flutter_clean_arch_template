# flutter_launcher_icons — App Launcher Icon Generator
#
# Usage:
#   just gen-icon
#   or: flutter pub run flutter_launcher_icons -f flutter_launcher_icons.yaml
#
# Docs: https://pub.dev/packages/flutter_launcher_icons

flutter_launcher_icons:
  # Source image — provide a 1024x1024 PNG with no transparency for best results
  image_path: 'assets/icon/app_icon.png'

  # ── Android ──────────────────────────────────────────────
  android: 'launcher_icon'
  min_sdk_android: 21

  # Adaptive icon (Android 8+): foreground image on a colored/image background
  # Uncomment and provide assets to enable:
  # adaptive_icon_background: '#ffffff'
  # adaptive_icon_foreground: 'assets/icon/app_icon_foreground.png'
  # adaptive_icon_monochrome: 'assets/icon/app_icon_monochrome.png'

  # ── iOS ──────────────────────────────────────────────────
  ios: true
  remove_alpha_ios: true
  # image_path_ios: 'assets/icon/app_icon_ios.png'

  # ── Web (uncomment to enable) ────────────────────────────
  # web:
  #   generate: true
  #   image_path: 'assets/icon/app_icon.png'
  #   background_color: '#ffffff'
  #   theme_color: '#ffffff'

  # ── macOS (uncomment to enable) ──────────────────────────
  # macos:
  #   generate: true
  #   image_path: 'assets/icon/app_icon.png'

  # ── Windows (uncomment to enable) ────────────────────────
  # windows:
  #   generate: true
  #   image_path: 'assets/icon/app_icon.png'
  #   icon_size: 48
